notes: >-
  Qwilt does not publish an RFC 9457 problem+json error registry. These entries
  are the HTTP failure responses derived from the API paths transcribed from the
  open-source Terraform provider client (which branches on 200/201 success, 302
  login redirect, and non-2xx failures).
problems:
  - status: 400
    title: Bad Request
    meaning: The request body or parameters were malformed.
    applies_to: [createSite, updateSite, createSiteConfiguration, createPublishingOperation, createCertificate, updateCertificate, createCertificateTemplate]
  - status: 401
    title: Unauthorized
    meaning: Missing or invalid API key / bearer token.
