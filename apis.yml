aid: qwilt
name: Qwilt
description: >-
  Qwilt operates a global content delivery network built on the Open Edge Cloud —
  a true edge cloud with thousands of deeply embedded caching nodes inside
  service-provider networks — for OTT video streaming, low-latency live, gaming,
  and software delivery. Qwilt exposes programmatic control of its CDN through the
  Sites API (media-delivery site objects, versioned configurations, and
  publish/un-publish operations), the Certificate Manager API (TLS certificates
  and Qwilt-managed CSR workflows), the Origin Allow List API, plus Delivery
  Reports and Keys Manager APIs. Automation is available via the official Qwilt
  Terraform provider and the qctl command-line interface. Authentication uses QC
  Services API keys (Viewer/Editor) sent as an X-API-KEY Authorization header, or
  a username/password bearer token.
